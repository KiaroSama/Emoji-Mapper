name: Audit source snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  snapshot:
    if: startsWith(github.head_ref, 'audit/2026-09-19-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture the exact source under review
        run: |
          mkdir -p "$RUNNER_TEMP/audit-source"
          git archive --format=tar --output="$RUNNER_TEMP/audit-source/source.tar" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/audit-source/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/audit-source/tree.txt"
          cd "$RUNNER_TEMP/audit-source"
          sha256sum source.tar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: audit-source-${{ github.sha }}
          path: ${{ runner.temp }}/audit-source/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Only freshly installed tool runtimes and public dependencies are archived.
      # Repository data, environments, Git configuration and credentials are excluded.
      - name: Package clean offline tooling
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/audit-runtime/wheels"
          python -m pip download --only-binary=:all: -r requirements.txt -r requirements-coins.txt -r requirements-dev.txt -d "$RUNNER_TEMP/audit-runtime/wheels"
          tar -czf "$RUNNER_TEMP/audit-runtime/python.tar.gz" -C "$pythonLocation" .
          PWSH_HOME=$(dirname "$(readlink -f "$(command -v pwsh)")")
          tar -czf "$RUNNER_TEMP/audit-runtime/powershell.tar.gz" -C "$PWSH_HOME" .
          npm ci --prefix worker --ignore-scripts
          tar -czf "$RUNNER_TEMP/audit-runtime/node_modules.tar.gz" -C worker node_modules
          python --version > "$RUNNER_TEMP/audit-runtime/versions.txt"
          node --version >> "$RUNNER_TEMP/audit-runtime/versions.txt"
          pwsh --version >> "$RUNNER_TEMP/audit-runtime/versions.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/audit-runtime/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
