name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The project targets Python 3.11 (see run.ps1 / .venv). SVG rendering
        # needs reportlab<4 (bundled renderPM backend, no system cairo); that
        # line ships wheels for 3.11 but not 3.12, so CI pins to 3.11 to match
        # the supported runtime and avoid fragile from-source builds.
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg (for video emoji tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Byte-compile all sources
        run: python -m compileall -q .

      - name: Import smoke test
        run: |
          python -c "import build_pack, make_emoji_pngs, fetch_pack, add_media, build_collection, emoji_bot; from emojikit import media, catalog, logsetup; print('imports OK')"

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: build_pack dry-run (no network)
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from PIL import Image
          os.makedirs("ci_tmp/out", exist_ok=True)
          Image.new("RGBA", (100, 100), (0, 128, 255, 255)).save("ci_tmp/out/a.png")
          os.environ["GENERAL_BOT_TOKEN"] = "dummy"
          r = subprocess.run([sys.executable, "build_pack.py", "--base", "ci",
                              "--title", "CI", "--user-id", "1",
                              "--source-dir", "ci_tmp/out",
                              "--token-env", "GENERAL_BOT_TOKEN", "--dry-run"])
          sys.exit(r.returncode)
          PY
