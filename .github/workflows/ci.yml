name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every job runs on the self-hosted runner, not on `ubuntu-latest`: this
# account's GitHub-hosted minutes are blocked, and a hosted job fails in two
# seconds with no runner, no steps and no log -- a red X that says nothing
# about the code. A self-hosted runner is not subject to that block.
#
# The runner is a WSL Ubuntu box. Its system packages (ffmpeg, the Chromium
# libraries) are installed ONCE, globally, and shared with every other runner
# on the machine; `AGENT_TOOLSDIRECTORY` points the setup-python/setup-node
# downloads at one shared tool cache for the same reason. Only the runner's
# own working directory is per-repository.
#
# Consequence to respect: a self-hosted runner is NOT a fresh machine. It has
# no passwordless sudo, so no step here may install a system package -- add it
# to the runner's global setup instead. State also survives between jobs, so
# nothing may depend on starting from an empty disk.

jobs:
  # The Worker is TypeScript with its own vitest suite. Its own job rather than
  # a step in `build`: it shares nothing with the Python matrix, needs Node
  # instead of Python + ffmpeg, and running it twice (once per Python version)
  # would be pure waste. A separate job also means a Worker failure is legible
  # as a Worker failure.
  worker:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm`. The post-job cache upload goes to GitHub's Actions
      # cache service, which this account's block gates the same way it gates
      # hosted runners: every real step passed and the job then sat in
      # "Post Set up Node" until the timeout, turning a green run into a red
      # one that said nothing. It buys nothing here anyway -- the runner is
      # persistent, so npm's own `~/.npm` survives between jobs on disk.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # `npm ci`, never `npm install`: it installs exactly the committed
      # lockfile and fails if package.json and the lock disagree, so CI cannot
      # quietly test a different dependency tree than the one committed.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # vitest stubs fetch, so nothing here can reach Telegram -- the same rule
      # the Python suite enforces with its hermetic guard, for the same reason:
      # a test once reached live Telegram and replaced a sticker in a published
      # pack. `--run` is explicit so a CI runner can never land in watch mode
      # and hang until the job timeout.
      - name: Unit tests (vitest)
        run: npx vitest run

  # The panel's browser suite drives the real page in headless Chromium. Its own
  # job for the same reason as the Worker's: it tests JavaScript, so running it
  # once per Python version would download Chromium twice to prove the same
  # thing. The `build` matrix therefore opts out of it explicitly -- the module
  # is a hard error, never a silent skip, when the browser is missing, so the
  # opt-out has to be stated somewhere rather than left to chance.
  panel-browser:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # No --with-deps: that flag runs apt-get under sudo, and this runner has
      # no passwordless sudo, so it would sit on a password prompt until the
      # job timeout. Chromium's system libraries are part of the runner's
      # global setup; only the browser build is fetched here, into the shared
      # tool cache, and only when that version is not already there.
      - name: Install Chromium
        run: python -m playwright install chromium

      # Named explicitly rather than globbed: `test_panel_*` would also match
      # the five panel suites the build matrix already runs, and running a test
      # in two jobs is worse than running it in one. `tests.` is the package
      # path, so tests/__init__.py still executes -- that file is the credential
      # scrub and the non-loopback socket block, and it is not optional.
      #
      # tests/test_ci_coverage.py fails if a browser suite exists on disk and is
      # missing from this line.
      - name: Panel browser tests
        run: python -m unittest tests.test_panel_browser tests.test_panel_queues -v

  build:
    runs-on: [self-hosted, linux, x64]
    # The panel's browser suite has its own job above. Opting out here is
    # deliberate and must stay explicit: test_panel_browser.py raises rather
    # than skipping when playwright or Chromium is missing, because a browser
    # test that reports green on a machine with no browser is worse than none.
    env:
      EMOJI_MAPPER_NO_BROWSER_TESTS: "1"
    strategy:
      matrix:
        # 3.11 is the runtime run.ps1 / .venv target; 3.12 guards against the
        # old reportlab-era assumption that newer Pythons are unsupported --
        # every dependency now ships wheels for both.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Both manifests: the core one, plus the coin extra (numpy). Not optional
      # here -- tests/test_entry_points.py imports EVERY discovered entry point,
      # and coins/remap_ids.py imports numpy at module level.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-coins.txt
          pip install ruff

      # CHECKED, not installed. The runner has no passwordless sudo, so an
      # apt-get here would sit on a password prompt until the job timeout --
      # twenty minutes of nothing, reported as a hang. ffmpeg is part of the
      # runner's global setup, shared with every other runner on the machine;
      # this step's job is to say so out loud when it is missing, in seconds.
      - name: Check ffmpeg is on the runner
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "::error::ffmpeg/ffprobe missing on this runner."
            echo "Install it once, globally: sudo apt-get install -y ffmpeg"
            exit 1
          fi
          ffmpeg -version | head -1

      # Before the suite: a syntax-level finding should fail in seconds, not
      # after 70 s of tests. No arguments -- ruff.toml owns the rule set, and a
      # --select here is how CI and a developer's local run start linting two
      # different things. scripts/check.ps1 runs the identical command.
      - name: Lint (ruff)
        run: ruff check .

      # The hand-written module list this replaced could not go stale loudly:
      # coins/verify_logos.py imported a name build_pack no longer exported and
      # nothing caught it, because no list mentioned coins/*. tests/
      # test_entry_points.py DISCOVERS every entry point, so a new tool is
      # covered as soon as it exists.
      - name: Import smoke test (all entry points, discovered)
        run: python -m unittest tests.test_entry_points -v

      # Byte-compile + the full suite, through the same script a developer runs,
      # so CI and local runs cannot drift into different invocations. The script
      # owns the `-t .` form, which is REQUIRED, not cosmetic: without it the
      # tests directory becomes the top level, modules load as `test_x` instead
      # of `tests.test_x`, and tests/__init__.py -- which scrubs credentials and
      # blocks the network -- never runs. tests.test_entry_points.SuiteIsHermetic
      # fails loudly if the suite is ever started without it.
      - name: Project checks (compile + unit tests)
        shell: pwsh
        run: |
          ./scripts/check.ps1
          exit $LASTEXITCODE

      - name: build_pack dry-run (no network)
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from PIL import Image
          os.makedirs("ci_tmp/out", exist_ok=True)
          Image.new("RGBA", (100, 100), (0, 128, 255, 255)).save("ci_tmp/out/a.png")
          os.environ["GENERAL_BOT_TOKEN"] = "dummy"
          r = subprocess.run([sys.executable, "build_pack.py", "--base", "ci",
                              "--title", "CI", "--user-id", "1",
                              "--source-dir", "ci_tmp/out",
                              "--token-env", "GENERAL_BOT_TOKEN", "--dry-run"])
          sys.exit(r.returncode)
          PY
