name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the runtime run.ps1 / .venv target; 3.12 guards against the
        # old reportlab-era assumption that newer Pythons are unsupported --
        # every dependency now ships wheels for both.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg (for video emoji tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Byte-compile all sources
        run: python -m compileall -q .

      # The hand-written module list this replaced could not go stale loudly:
      # coins/verify_logos.py imported a name build_pack no longer exported and
      # nothing caught it, because no list mentioned coins/*. tests/
      # test_entry_points.py DISCOVERS every entry point, so a new tool is
      # covered as soon as it exists.
      - name: Import smoke test (all entry points, discovered)
        run: python -m unittest tests.test_entry_points -v

      # -t . is REQUIRED, not cosmetic: without it the tests directory becomes
      # the top-level, modules load as `test_x` instead of `tests.test_x`, and
      # tests/__init__.py -- which scrubs credentials and blocks the network --
      # never runs. tests.test_entry_points.SuiteIsHermetic fails loudly if the
      # suite is ever started without it.
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -p "test_*.py"

      - name: build_pack dry-run (no network)
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from PIL import Image
          os.makedirs("ci_tmp/out", exist_ok=True)
          Image.new("RGBA", (100, 100), (0, 128, 255, 255)).save("ci_tmp/out/a.png")
          os.environ["GENERAL_BOT_TOKEN"] = "dummy"
          r = subprocess.run([sys.executable, "build_pack.py", "--base", "ci",
                              "--title", "CI", "--user-id", "1",
                              "--source-dir", "ci_tmp/out",
                              "--token-env", "GENERAL_BOT_TOKEN", "--dry-run"])
          sys.exit(r.returncode)
          PY
