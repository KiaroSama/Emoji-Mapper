name: Audit reproduction source
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  source:
    if: github.head_ref == 'audit/2026-09-21-persistence-recheck'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Only committed public source, before dependencies or application code run.
      - name: Snapshot tracked source
        run: |
          mkdir -p "$RUNNER_TEMP/audit-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/audit-source/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/audit-source/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/audit-source/tree.txt"
          cd "$RUNNER_TEMP/audit-source"
          sha256sum source.tar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: audit6-source-${{ github.sha }}
          path: ${{ runner.temp }}/audit-source/
          retention-days: 1
          if-no-files-found: error
