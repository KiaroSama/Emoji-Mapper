# Linting for Numera Emoji Mapper.
#
# The rule set is not a preference -- it is the one this codebase already
# assumes. 122 `# noqa` comments were written against a linter that was never
# configured, so nobody could tell whether they were accurate or superstition.
# Enabling exactly the codes they name (E402, BLE001) makes every one of them
# load-bearing, and RUF100 fails the moment one stops being needed.

line-length = 88
exclude = ["collection_archive", ".claude", "graphify-out"]

[lint]
select = [
    "E4", "E7", "E9", "F",  # ruff's default: real errors, not style opinions
    "E402",    # import not at top -- 62 deliberate noqas guard the
               # sys.path.insert() that every entry point needs before it can
               # import the package it lives beside
    "BLE001",  # blind `except Exception` -- 60 deliberate noqas, each one
               # marking a place where swallowing really is the right answer
               # (optional labels, log housekeeping). An unmarked one is a bug.
    "B",       # bugbear: mutable defaults, loop-variable capture, and
               # zip() without strict=, which silently truncates to the shorter
               # side -- the exact shape of this repo's recurring "a count is
               # not an identity" defect
    "RUF100",  # an unused noqa is a claim about code that has since changed
]

# ARG (unused arguments) is deliberately off: 166 hits, essentially all of them
# test fakes and BaseHTTPRequestHandler overrides that must match a signature
# they do not use. Enabling it would mean 166 more noqas that say nothing.
