name = "emoji-mapper-bots"
main = "src/index.ts"
compatibility_date = "2026-08-18"

# workers.dev on, preview URLs OFF. Both default to ON, and a preview URL would
# publish /tg/general, /tg/coin and /publish on a second hostname per deployed
# version. The secrets still guard them, but an endpoint nothing points at is
# surface with no upside.
workers_dev = true
preview_urls = false

# No [vars]. Everything the Worker reads -- both bot tokens, both webhook
# secrets, the publish bearer, the admin list AND the channel -- is a secret set
# with `wrangler secret put`, so none of it appears in this file or in git.
#
# The channel is not a credential, but putting it here would publish the owner's
# channel name in a public repo, and a secret costs nothing extra: both arrive
# as `env.PACK_LINKS_CHAT_ID` at runtime. Use `worker\scripts\put-secrets.ps1`
# to push all of them straight from .env without printing any value.

# Log store. A binding cannot be a secret, and a database_id is useless without
# account credentials, so this one line is fine in a public file.
# Created by `scripts\deploy.ps1`, which fills the id in and applies migrations.
[[d1_databases]]
binding = "DB"
database_name = "emoji-mapper-logs"
database_id = "e9a95a21-5952-4fe4-88f8-27047652a375"
migrations_dir = "migrations"
